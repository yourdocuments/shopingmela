<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Mela — Shop Owner Login</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:linear-gradient(135deg,#eef5ff,#f8f9fb);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#101828;
}

.login-card{
  width:100%;
  max-width:410px;
  background:#fff;
  border:1px solid #eaecf0;
  border-radius:20px;
  padding:30px;
  box-shadow:0 15px 45px rgba(16,24,40,.08);
}

.logo{
  text-align:center;
  margin-bottom:25px;
}

.logo-icon{
  width:58px;
  height:58px;
  border-radius:16px;
  background:#1877f2;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:28px;
  margin:0 auto 12px;
}

.logo h1{
  font-size:21px;
  margin:0;
}

.logo p{
  margin:6px 0 0;
  color:#667085;
  font-size:11px;
}

.title{
  font-size:16px;
  font-weight:800;
  margin-bottom:18px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-size:10px;
  color:#667085;
  margin-bottom:6px;
}

.field input{
  width:100%;
  padding:12px 13px;
  border:1px solid #d0d5dd;
  border-radius:9px;
  outline:none;
  font-size:12px;
}

.field input:focus{
  border-color:#1877f2;
  box-shadow:0 0 0 3px #1877f21a;
}

.login-btn{
  width:100%;
  border:0;
  background:#1877f2;
  color:#fff;
  padding:12px;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
  margin-top:5px;
}

.login-btn:hover{
  background:#1266d6;
}

.error{
  display:none;
  background:#fff1f0;
  color:#d92d20;
  border:1px solid #fecdca;
  border-radius:8px;
  padding:10px;
  font-size:10px;
  margin-bottom:14px;
}

.error.show{
  display:block;
}

.demo{
  margin-top:20px;
  padding:12px;
  background:#f9fafb;
  border-radius:9px;
  font-size:9px;
  color:#667085;
  line-height:1.7;
}

.demo strong{
  color:#344054;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#1877f2;
  text-decoration:none;
  font-size:10px;
}

.footer{
  text-align:center;
  margin-top:22px;
  color:#98a2b3;
  font-size:8px;
}
</style>
</head>

<body>

<div class="login-card">

  <div class="logo">
    <div class="logo-icon">🏪</div>
    <h1>Shopping Mela</h1>
    <p>Shop Owner Portal</p>
  </div>

  <div class="title">Shop Owner Login</div>

  <div class="error" id="errorBox"></div>

  <form id="loginForm">

    <div class="field">
      <label>Customer / Shop Owner ID</label>
      <input
        type="text"
        id="ownerId"
        placeholder="Enter your ID"
        autocomplete="username"
        required
      >
    </div>

    <div class="field">
      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >
    </div>

    <button class="login-btn" type="submit">
      Login to My Store
    </button>

  </form>

  <div class="demo">
    <strong>Demo Login</strong><br>
    Owner ID: <strong>10001</strong><br>
    Password: <strong>123456</strong>
  </div>

  <a href="index.html" class="back">
    ← Back to Shopping Mela
  </a>

  <div class="footer">
    © Shopping Mela — Shop Owner Portal
  </div>

</div>

<script>
"use strict";

/*
  SHOP OWNER LOGIN
  ----------------
  Firebase আসার আগে demo/testing-এর জন্য
  localStorage + sessionStorage ব্যবহার করা হচ্ছে।
*/

const OWNER_SESSION_KEY = "shoppingMelaShopOwnerLoggedIn";
const OWNER_ID_KEY = "shoppingMelaShopOwnerId";
const OWNER_LOGIN_TIME_KEY = "shoppingMelaShopOwnerLoginTime";

const DEMO_OWNER = {
  id: "10001",
  password: "123456",
  name: "Demo Shop Owner"
};

/* যদি আগে থেকেই login করা থাকে */
function isLoggedIn(){
  return (
    sessionStorage.getItem(OWNER_SESSION_KEY) === "true" &&
    sessionStorage.getItem(OWNER_ID_KEY)
  );
}

/*
  Login
*/
document.getElementById("loginForm").addEventListener("submit", function(e){

  e.preventDefault();

  const ownerId =
    document.getElementById("ownerId").value.trim();

  const password =
    document.getElementById("password").value;

  const errorBox =
    document.getElementById("errorBox");

  errorBox.classList.remove("show");
  errorBox.textContent = "";

  if(!ownerId){
    showError("Owner ID দিন।");
    return;
  }

  if(!password){
    showError("Password দিন।");
    return;
  }

  /*
    আপাতত demo account।
    পরে Firebase Authentication দিয়ে replace হবে।
  */
  if(
    ownerId === DEMO_OWNER.id &&
    password === DEMO_OWNER.password
  ){

    sessionStorage.setItem(
      OWNER_SESSION_KEY,
      "true"
    );

    sessionStorage.setItem(
      OWNER_ID_KEY,
      DEMO_OWNER.id
    );

    sessionStorage.setItem(
      OWNER_LOGIN_TIME_KEY,
      String(Date.now())
    );

    /*
      Owner-এর basic information
      testing-এর জন্য save করছি।
    */
    localStorage.setItem(
      "shoppingMelaCurrentShopOwner",
      JSON.stringify({
        id: DEMO_OWNER.id,
        name: DEMO_OWNER.name
      })
    );

    window.location.href =
      "shop-owner-dashboard.html";

  }else{

    showError(
      "Owner ID অথবা Password সঠিক নয়।"
    );
  }

});


function showError(message){

  const box =
    document.getElementById("errorBox");

  box.textContent = message;
  box.classList.add("show");
}


/*
  যদি already logged in থাকে,
  login page-এ না থেকে dashboard-এ যাবে।
*/
if(isLoggedIn()){
  window.location.href =
    "shop-owner-dashboard.html";
}
</script>

</body>
</html>
```
