<script>


/* =====================================================
   ORDERS ARRAY
===================================================== */

let orders = [];



/* =====================================================
   LOAD ORDERS
===================================================== */

function loadOrders() {

    try {

        orders =
            JSON.parse(
                localStorage.getItem(
                    "shoppingMelaOrders"
                )
            ) || [];

    } catch (error) {

        orders = [];

    }

}



/* =====================================================
   MONEY
===================================================== */

function money(amount) {

    return "৳" +
        Number(amount || 0)
            .toLocaleString("en-BD");

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}



/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(dateString) {

    if (!dateString) {

        return "Date unavailable";

    }


    const date =
        new Date(dateString);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "Date unavailable";

    }


    return date.toLocaleDateString(
        "en-BD",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    )
    +
    " • "
    +
    date.toLocaleTimeString(
        "en-BD",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}



/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders() {

    const list =
        document.getElementById(
            "ordersList"
        );


    const empty =
        document.getElementById(
            "emptyOrders"
        );


    const tools =
        document.getElementById(
            "ordersTools"
        );


    list.innerHTML = "";


    if (
        !orders.length
    ) {

        empty.style.display =
            "block";

        tools.style.display =
            "none";

        return;

    }


    empty.style.display =
        "none";

    tools.style.display =
        "flex";


    /*
       Newest order first
    */

    const sortedOrders =
        [...orders].reverse();


    sortedOrders.forEach(
        order => {

            list.appendChild(
                createOrderCard(
                    order
                )
            );

        }
    );

}



/* =====================================================
   CREATE ORDER CARD
===================================================== */

function createOrderCard(
    order
) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "order-card";


    const customer =
        order.customer ||
        {};


    const products =
        Array.isArray(
            order.products
        )
        ? order.products
        : [];


    const orderProducts =
        products
            .map(
                item => {

                    const quantity =
                        Number(
                            item.quantity ||
                            1
                        );


                    const total =
                        Number(
                            item.price ||
                            0
                        ) *
                        quantity;


                    return `

                        <div
                            class="order-product"
                        >

                            <div
                                class="order-product-image"
                                style="
                                    background-image:
                                    url('${escapeHTML(
                                        item.image
                                    )}');
                                "
                            ></div>


                            <div
                                class="order-product-info"
                            >

                                <h3>
                                    ${escapeHTML(
                                        item.name
                                    )}
                                </h3>


                                <p>
                                    Qty:
                                    ${quantity}
                                    ×
                                    ${money(
                                        item.price
                                    )}
                                </p>


                                <div
                                    class="verified-seller"
                                >

                                    <span
                                        class="verified-badge"
                                    >
                                        ✓
                                    </span>

                                    Verified Seller

                                </div>

                            </div>


                            <div
                                class="order-product-price"
                            >
                                ${money(total)}
                            </div>

                        </div>

                    `;

                }
            )
            .join("");


    card.innerHTML = `

        <!-- ORDER TOP -->

        <div
            class="order-top"
        >

            <div
                class="order-id-box"
            >

                <strong>
                    Order #${escapeHTML(
                        order.orderId ||
                        "SM000000"
                    )}
                </strong>

                <span
                    class="order-date"
                >
                    ${formatDate(
                        order.createdAt
                    )}
                </span>

            </div>


            <div
                class="order-status"
            >

                <span
                    class="status-dot"
                ></span>

                Order Placed

            </div>

        </div>



        <!-- ORDER BODY -->

        <div
            class="order-body"
        >

            <div
                class="order-products"
            >

                ${orderProducts}

            </div>



            <!-- SUMMARY -->

            <div
                class="order-summary-box"
            >

                <div
                    class="summary-table"
                >

                    <div
                        class="summary-line"
                    >

                        <span>
                            Subtotal
                        </span>

                        <strong>
                            ${money(
                                order.subtotal
                            )}
                        </strong>

                    </div>


                    <div
                        class="summary-line discount"
                    >

                        <span>
                            Discount
                        </span>

                        <strong>
                            -${money(
                                order.discount
                            )}
                        </strong>

                    </div>


                    <div
                        class="summary-line"
                    >

                        <span>
                            Delivery
                        </span>

                        <strong>
                            ${money(
                                order.delivery
                            )}
                        </strong>

                    </div>


                    <div
                        class="summary-total"
                    >

                        <span>
                            Total
                        </span>

                        <strong>
                            ${money(
                                order.total
                            )}
                        </strong>

                    </div>

                </div>

            </div>



            <!-- DELIVERY -->

            <div
                class="delivery-info"
            >

                <h3>
                    📍 Delivery Information
                </h3>


                <p>
                    <strong>Name:</strong>
                    ${escapeHTML(
                        customer.name
                    )}
                </p>


                <p>
                    <strong>Mobile:</strong>
                    ${escapeHTML(
                        customer.phone
                    )}
                </p>


                <p>
                    <strong>Address:</strong>
                    ${escapeHTML(
                        customer.address
                    )}
                </p>


                <p>
                    <strong>District:</strong>
                    ${escapeHTML(
                        customer.district
                    )}
                </p>


                <p>
                    <strong>Division:</strong>
                    ${escapeHTML(
                        customer.division
                    )}
                </p>


                ${
                    customer.note
                    ? `
                        <p>
                            <strong>Note:</strong>
                            ${escapeHTML(
                                customer.note
                            )}
                        </p>
                    `
                    : ""
                }

            </div>



            <!-- ACTIONS -->

            <div
                class="order-actions"
            >

                <button
                    class="order-action"
                    onclick="
                        printOrder(
                            '${escapeHTML(
                                order.orderId
                            )}'
                        )
                    "
                >
                    🖨 Print
                </button>


                <button
                    class="
                        order-action
                        primary
                    "
                    onclick="
                        buyAgain(
                            '${escapeHTML(
                                order.orderId
                            )}'
                        )
                    "
                >
                    🛒 Buy Again
                </button>

            </div>

        </div>

    `;


    return card;

}



/* =====================================================
   FIND ORDER
===================================================== */

function findOrder(
    orderId
) {

    return orders.find(
        order =>
            String(
                order.orderId
            ) ===
            String(orderId)
    );

}



/* =====================================================
   BUY AGAIN
===================================================== */

function buyAgain(
    orderId
) {

    const order =
        findOrder(
            orderId
        );


    if (
        !order ||
        !Array.isArray(
            order.products
        )
    ) {

        showToast(
            "Order পাওয়া যায়নি"
        );

        return;

    }


    let existingCart = [];


    try {

        existingCart =
            JSON.parse(
                localStorage.getItem(
                    "shoppingMelaCart"
                )
            ) || [];

    } catch (error) {

        existingCart = [];

    }


    order.products.forEach(
        product => {

            const existing =
                existingCart.find(
                    item =>
                        String(item.id) ===
                        String(product.id)
                );


            if (existing) {

                existing.quantity +=
                    Number(
                        product.quantity ||
                        1
                    );

            } else {

                existingCart.push({

                    ...product

                });

            }

        }
    );


    localStorage.setItem(
        "shoppingMelaCart",
        JSON.stringify(
            existingCart
        )
    );


    showToast(
        "Products Cart-এ যোগ করা হয়েছে 🛒"
    );


    setTimeout(
        () => {

            window.location.href =
                "cart.html";

        },
        700
    );

}



/* =====================================================
   PRINT ORDER
===================================================== */

function printOrder(
    orderId
) {

    const order =
        findOrder(
            orderId
        );


    if (!order) {

        showToast(
            "Order পাওয়া যায়নি"
        );

        return;

    }


    const products =
        order.products || [];


    const productRows =
        products
            .map(
                item => `

                    <tr>

                        <td>
                            ${escapeHTML(
                                item.name
                            )}
                        </td>

                        <td>
                            ${item.quantity || 1}
                        </td>

                        <td>
                            ${money(
                                item.price
                            )}
                        </td>

                    </tr>

                `
            )
            .join("");


    const customer =
        order.customer || {};


    const printWindow =
        window.open(
            "",
            "_blank"
        );


    if (!printWindow) {

        showToast(
            "Popup blocked হয়েছে। Browser popup allow করুন।"
        );

        return;

    }


    printWindow.document.write(`

        <!DOCTYPE html>

        <html>

        <head>

            <title>
                Order ${escapeHTML(
                    order.orderId
                )}
            </title>

            <style>

                body {
                    font-family:
                        Arial,
                        sans-serif;

                    padding: 30px;

                    color: #111827;
                }

                h1 {
                    margin-bottom: 5px;
                }

                p {
                    color: #4b5563;
                    font-size: 13px;
                }

                table {
                    width: 100%;
                    border-collapse:
                        collapse;

                    margin-top: 25px;
                }

                th,
                td {
                    border:
                        1px solid #ddd;

                    padding: 10px;

                    text-align: left;

                    font-size: 13px;
                }

                th {
                    background:
                        #f5f5f5;
                }

                .total {
                    margin-top: 20px;

                    font-size: 18px;

                    font-weight: bold;

                    text-align: right;
                }

            </style>

        </head>


        <body>

            <h1>
                Shopping Mela

function clearOrders() {

    if (!orders.length) {

        showToast(
            "কোনো order history নেই"
        );

        return;

    }


    const confirmed =
        confirm(
            "আপনি কি সব Order History delete করতে চান?"
        );


    if (!confirmed) {

        return;

    }


    localStorage.removeItem(
        "shoppingMelaOrders"
    );


    localStorage.removeItem(
        "shoppingMelaLastOrder"
    );


    orders = [];


    renderOrders();


    showToast(
        "Order History clear করা হয়েছে"
    );

}



/* =====================================================
   TOAST
===================================================== */

function showToast(
    message
) {

    const toast =
        document.getElementById(
            "ordersToast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.orderToastTimer
    );


    window.orderToastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}
