<div class="logo">

<h1>
    Admin Login
</h1>


<p class="subtitle">

    Shopping Mela Admin Dashboard-এ
    প্রবেশ করতে Login করুন।

</p>


<div class="admin-badge">

    <span class="verified">

    </span>

    Verified Admin Access

</div>


<div
    class="message"
    id="message"
></div>


<form
    id="loginForm"
    autocomplete="on"
>


    <div class="form-group">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Admin username"
            autocomplete="username"
            required
        >

    </div>


    <div class="form-group">

        <label for="password">
            Password
        </label>


        <div class="input-wrap">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Admin password"
                autocomplete="current-password"
                required
            >


            <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="Show password"
            >
                👁️
            </button>

        </div>


        <div class="forgot-row">

            <a
                href="admin-recovery.html"
                class="forgot-link"
            >
                Forgot Password?
            </a>

        </div>

    </div>


    <button
        type="submit"
        class="login-btn"
        id="loginBtn"
    >
        🔐 Login to Admin
    </button>


</form>

</div>

<script>


/* =====================================================
   1.41.3 — ADMIN LOGIN
===================================================== */


/*
   Default credentials:

   Username: admin
   Password: 123456

   Password reset হলে localStorage-এর
   updated password ব্যবহার হবে।
*/


const DEFAULT_USERNAME =
    "admin";


const DEFAULT_PASSWORD =
    "123456";



/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
    document.getElementById(
        "loginForm"
    );


const usernameInput =
    document.getElementById(
        "username"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginBtn =
    document.getElementById(
        "loginBtn"
    );


const messageBox =
    document.getElementById(
        "message"
    );


const togglePasswordBtn =
    document.getElementById(
        "togglePassword"
    );



/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
    text,
    type
) {

    messageBox.textContent =
        text;

    messageBox.className =
        "message show " +
        type;

}



/* =====================================================
   HIDE MESSAGE
===================================================== */

function hideMessage() {

    messageBox.textContent =
        "";

    messageBox.className =
        "message";

}



/* =====================================================
   PASSWORD TOGGLE
===================================================== */

togglePasswordBtn.addEventListener(
    "click",
    function() {

        if (
            passwordInput.type ===
            "password"
        ) {

            passwordInput.type =
                "text";

            this.textContent =
                "🙈";

            this.setAttribute(
                "aria-label",
                "Hide password"
            );

        } else {

            passwordInput.type =
                "password";

            this.textContent =
                "👁️";

            this.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    }
);



/* =====================================================
   GET SAVED PASSWORD
===================================================== */

function getAdminPassword() {

    const savedPassword =
        localStorage.getItem(
            "shoppingMelaAdminPassword"
        );


    /*
       যদি নতুন password save করা থাকে,
       সেটি ব্যবহার হবে।
    */


    if (
        savedPassword !== null &&
        savedPassword !== ""
    ) {

        return savedPassword;

    }


    /*
       প্রথমবার login-এর জন্য
       default password।
    */

    return DEFAULT_PASSWORD;

}



/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        hideMessage();


        const username =
            usernameInput.value.trim();


        const password =
            passwordInput.value;



        if (!username) {

            showMessage(
                "Username দিন।",
                "error"
            );

            usernameInput.focus();

            return;

        }


        if (!password) {

            showMessage(
                "Password দিন।",
                "error"
            );

            passwordInput.focus();

            return;

        }



        const savedPassword =
            getAdminPassword();



        /*
           Username + password check
        */

        if (
            username !==
            DEFAULT_USERNAME
        ) {

            showMessage(
                "Username অথবা password সঠিক নয়।",
                "error"
            );

            passwordInput.value =
                "";

            return;

        }



        if (
            password !==
            savedPassword
        ) {

            showMessage(
                "Username অথবা password সঠিক নয়।",
                "error"
            );

            passwordInput.value =
                "";

            passwordInput.focus();

            return;

        }



        /*
           Login successful
        */

        sessionStorage.setItem(
            "shoppingMelaAdminLoggedIn",
            "true"
        );


        sessionStorage.setItem(
            "shoppingMelaAdminLoginTime",
            new Date().toISOString()
        );



        loginBtn.disabled =
            true;


        loginBtn.textContent =
            "✓ Login Successful";


        showMessage(
            "Admin login সফল হয়েছে। Dashboard-এ নেওয়া হচ্ছে...",
            "success"
        );



        setTimeout(
            function() {

                window.location.replace(
                    "admin.html"
                );

            },
            700
        );

    }
);



/* =====================================================
   ALREADY LOGGED IN
===================================================== */

const alreadyLoggedIn =
    sessionStorage.getItem(
        "shoppingMelaAdminLoggedIn"
    );


if (
    alreadyLoggedIn ===
    "true"
) {

    showMessage(
        "আপনি ইতিমধ্যে Admin হিসেবে login করা আছেন।",
        "info"
    );


    /*
       চাইলে এখানে সরাসরি dashboard-এ
       পাঠানো যায়।
    */

}



/* =====================================================
   ENTER KEY SUPPORT
===================================================== */

usernameInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            passwordInput.focus();

        }

    }
);


</script>

</body>
