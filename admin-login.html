<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milon Mela | Admin Login</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

    body{
      min-height:100vh;
      background:
        radial-gradient(circle at top left,rgba(255,107,0,.18),transparent 35%),
        radial-gradient(circle at bottom right,rgba(255,107,0,.12),transparent 35%),
        #f5f6f8;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .login-wrapper{width:100%;max-width:430px}

    .login-card{
      background:#fff;
      border-radius:24px;
      padding:32px 28px;
      box-shadow:0 18px 50px rgba(0,0,0,.12);
      border:1px solid rgba(0,0,0,.06);
    }

    .brand{text-align:center;margin-bottom:28px}

    .brand img{
      width:82px;height:82px;object-fit:contain;margin-bottom:12px
    }

    .brand h1{font-size:28px;color:#ff6b00;margin-bottom:6px}
    .brand p{color:#777;font-size:14px}

    .admin-badge{
      display:inline-block;
      margin-top:12px;
      background:#fff1e8;
      color:#ff6b00;
      padding:7px 14px;
      border-radius:50px;
      font-size:13px;
      font-weight:bold
    }

    .form-group{margin-bottom:18px}

    label{
      display:block;
      font-size:14px;
      font-weight:bold;
      margin-bottom:8px;
      color:#333
    }

    .input-box{position:relative}

    input{
      width:100%;
      padding:14px 45px 14px 15px;
      border:1px solid #ddd;
      border-radius:13px;
      outline:none;
      font-size:15px;
      background:#fafafa;
      transition:.2s
    }

    input:focus{
      border-color:#ff6b00;
      background:#fff;
      box-shadow:0 0 0 3px rgba(255,107,0,.10)
    }

    .input-icon{
      position:absolute;
      right:15px;
      top:50%;
      transform:translateY(-50%);
      color:#999;
      font-size:18px;
      pointer-events:none
    }

    .password-toggle{
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:transparent;
      cursor:pointer;
      color:#777;
      font-size:16px;
      padding:5px
    }

    .login-btn{
      width:100%;
      border:0;
      border-radius:13px;
      padding:15px;
      background:#ff6b00;
      color:#fff;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:.2s;
      margin-top:5px
    }

    .login-btn:hover{background:#e85f00;transform:translateY(-1px)}
    .login-btn:disabled{opacity:.65;cursor:not-allowed;transform:none}

    .message{
      display:none;
      padding:12px 14px;
      border-radius:12px;
      margin-bottom:18px;
      font-size:14px;
      line-height:1.5
    }

    .message.error{
      display:block;
      background:#fff0f0;
      color:#c62828;
      border:1px solid #ffd1d1
    }

    .message.success{
      display:block;
      background:#effbf3;
      color:#218838;
      border:1px solid #ccebd5
    }

    .security-box{
      margin-top:20px;
      padding:12px 14px;
      border-radius:12px;
      background:#f8f9fa;
      color:#666;
      font-size:12px;
      text-align:center
    }

    .bottom-info{
      text-align:center;
      margin-top:22px;
      color:#888;
      font-size:12px;
      line-height:1.6
    }

    .loading{
      display:inline-flex;
      align-items:center;
      gap:8px;
      justify-content:center
    }

    .spinner{
      width:16px;height:16px;
      border:2px solid rgba(255,255,255,.4);
      border-top-color:#fff;
      border-radius:50%;
      animation:spin .7s linear infinite
    }

    .page-spinner{
      width:30px;height:30px;
      border:3px solid #eee;
      border-top-color:#ff6b00;
      border-radius:50%;
      animation:spin .7s linear infinite;
      margin:0 auto 12px
    }

    .checking{
      position:fixed;
      inset:0;
      background:#f5f6f8;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:10
    }

    .checking-box{
      background:#fff;
      padding:30px;
      border-radius:18px;
      text-align:center;
      box-shadow:0 12px 35px rgba(0,0,0,.08)
    }

    @keyframes spin{to{transform:rotate(360deg)}}

    @media(max-width:480px){
      .login-card{padding:26px 20px;border-radius:20px}
      .brand h1{font-size:25px}
    }
  </style>
</head>

<body>

  <!-- Initial Firebase check -->
  <div class="checking" id="checkingScreen">
    <div class="checking-box">
      <div class="page-spinner"></div>
      <strong>Checking Admin Login...</strong>
      <p style="color:#777;font-size:13px;margin-top:7px">
        Please wait
      </p>
    </div>
  </div>

  <div class="login-wrapper" id="loginWrapper" style="display:none">

    <div class="login-card">

      <div class="brand">
        <img
          src="./assets/icon/192MILONMELA.svg.svg"
          alt="Milon Mela"
          onerror="this.style.display='none'"
        >

        <h1>Milon Mela</h1>
        <p>Smart Local Marketplace</p>

        <div class="admin-badge">
          🔐 Admin Panel
        </div>
      </div>

      <div id="messageBox" class="message"></div>

      <form id="adminLoginForm" novalidate>

        <div class="form-group">
          <label for="adminEmail">Admin Email</label>

          <div class="input-box">
            <input
              type="email"
              id="adminEmail"
              placeholder="admin@example.com"
              autocomplete="username"
              required
            >
            <span class="input-icon">✉</span>
          </div>
        </div>

        <div class="form-group">
          <label for="adminPassword">Password</label>

          <div class="input-box">
            <input
              type="password"
              id="adminPassword"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="togglePassword"
              aria-label="Show password"
            >👁</button>
          </div>
        </div>

        <button
          type="submit"
          class="login-btn"
          id="loginButton"
        >
          Login to Admin Panel
        </button>

      </form>

      <div class="security-box">
        🔒 Secure login powered by Firebase Authentication
      </div>

      <div class="bottom-info">
        Milon Mela Admin System<br>
        Authorized administrators only
      </div>

    </div>
  </div>


  <script type="module">

    /*
      =========================================================
      MILON MELA ADMIN LOGIN — FIXED VERSION
      =========================================================

      This version intentionally keeps the Firebase config
      inside this page so the login page does not depend on
      a separate firebase-config.js file loading correctly.

      Dashboard protection still checks users/{UID}.role == "admin".
    */

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /* =========================================================
       FIREBASE CONFIG
    ========================================================= */

    const firebaseConfig = {
      apiKey: "AIzaSyA8Ixnp_UKTQoLQ1PW8vk6Uz5eUplDF8ag",
      authDomain: "milonmelay.firebaseapp.com",
      projectId: "milonmelay",
      storageBucket: "milonmelay.firebasestorage.app",
      messagingSenderId: "1047973064469",
      appId: "1:1047973064469:web:8cfa4ad0ec123df8d4431c",
      measurementId: "G-6N9HYS9GKN"
    };


    /* =========================================================
       INITIALIZE FIREBASE
    ========================================================= */

    let firebaseApp;
    let auth;
    let db;

    try {

      firebaseApp =
        initializeApp(firebaseConfig);

      auth =
        getAuth(firebaseApp);

      db =
        getFirestore(firebaseApp);

      console.log(
        "Milon Mela Firebase initialized successfully."
      );

    } catch (error) {

      console.error(
        "Firebase initialization error:",
        error
      );

      document.getElementById(
        "checkingScreen"
      ).style.display = "none";

      document.getElementById(
        "loginWrapper"
      ).style.display = "block";

      showMessage(
        "Firebase load হয়নি। Internet এবং Firebase configuration check করুন।",
        "error"
      );

      throw error;
    }


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const checkingScreen =
      document.getElementById(
        "checkingScreen"
      );

    const loginWrapper =
      document.getElementById(
        "loginWrapper"
      );

    const loginForm =
      document.getElementById(
        "adminLoginForm"
      );

    const emailInput =
      document.getElementById(
        "adminEmail"
      );

    const passwordInput =
      document.getElementById(
        "adminPassword"
      );

    const loginButton =
      document.getElementById(
        "loginButton"
      );

    const messageBox =
      document.getElementById(
        "messageBox"
      );

    const togglePassword =
      document.getElementById(
        "togglePassword"
      );


    /* =========================================================
       MESSAGE
    ========================================================= */

    function showMessage(
      message,
      type
    ) {

      messageBox.textContent =
        message;

      messageBox.className =
        "message " + type;

    }


    function hideMessage() {

      messageBox.textContent = "";

      messageBox.className =
        "message";

    }


    /* =========================================================
       SHOW LOGIN PAGE
    ========================================================= */

    function showLoginPage() {

      checkingScreen.style.display =
        "none";

      loginWrapper.style.display =
        "block";

    }


    /* =========================================================
       PASSWORD SHOW / HIDE
    ========================================================= */

    togglePassword.addEventListener(
      "click",
      function() {

        if (
          passwordInput.type ===
          "password"
        ) {

          passwordInput.type =
            "text";

          togglePassword.textContent =
            "🙈";

          togglePassword.setAttribute(
            "aria-label",
            "Hide password"
          );

        } else {

          passwordInput.type =
            "password";

          togglePassword.textContent =
            "👁";

          togglePassword.setAttribute(
            "aria-label",
            "Show password"
          );

        }

      }
    );


    /* =========================================================
       ADMIN ROLE CHECK
    ========================================================= */

    async function isAdmin(user) {

      if (!user) {
        return false;
      }

      try {

        const adminRef =
          doc(
            db,
            "users",
            user.uid
          );

        const adminSnap =
          await getDoc(
            adminRef
          );

        if (
          !adminSnap.exists()
        ) {

          console.warn(
            "Admin user document not found."
          );

          return false;
        }

        const data =
          adminSnap.data();

        return (
          data.role ===
          "admin"
        );

      } catch (error) {

        console.error(
          "Admin role check error:",
          error
        );

        throw error;
      }
    }


    /* =========================================================
       EXISTING LOGIN CHECK
    ========================================================= */

    onAuthStateChanged(
      auth,
      async function(user) {

        try {

          if (!user) {

            showLoginPage();

            return;
          }


          /*
            A Firebase login alone is not enough.
            Check Firestore admin role.
          */

          const admin =
            await isAdmin(user);


          if (admin) {

            console.log(
              "Existing admin session:",
              user.email
            );

            window.location.replace(
              "admin-dashboard.html"
            );

            return;

          }


          /*
            Logged in but not admin.
          */

          await signOut(auth);

          showLoginPage();

          showMessage(
            "এই account-এর Admin access নেই।",
            "error"
          );

        }

        catch (error) {

          console.error(
            "Existing session check error:",
            error
          );

          showLoginPage();

          showMessage(
            friendlyError(error),
            "error"
          );

        }

      }
    );


    /* =========================================================
       LOGIN SUBMIT
    ========================================================= */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        hideMessage();


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email) {

          showMessage(
            "Admin Email দিন।",
            "error"
          );

          emailInput.focus();

          return;
        }


        if (!password) {

          showMessage(
            "Password দিন।",
            "error"
          );

          passwordInput.focus();

          return;
        }


        loginButton.disabled =
          true;

        loginButton.innerHTML = `
          <span class="loading">
            <span class="spinner"></span>
            Logging in...
          </span>
        `;


        try {

          console.log(
            "Starting Firebase Admin Login..."
          );


          /*
            Keep login persistent.
          */

          await setPersistence(
            auth,
            browserLocalPersistence
          );


          /*
            Firebase Email/Password Login
          */

          const credential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            credential.user;


          console.log(
            "Firebase authentication successful:",
            user.email
          );


          /*
            IMPORTANT:
            Check Firestore admin role
            before opening dashboard.
          */

          const admin =
            await isAdmin(user);


          if (!admin) {

            await signOut(auth);

            showMessage(
              "Login হয়েছে, কিন্তু এই account Admin নয়। Firestore users/" +
              user.uid +
              " document-এ role: admin দিন।",
              "error"
            );

            return;
          }


          /*
            ADMIN LOGIN SUCCESS
          */

          showMessage(
            "Admin Login successful. Dashboard খুলছে...",
            "success"
          );


          setTimeout(
            function() {

              window.location.replace(
                "admin-dashboard.html"
              );

            },
            500
          );

        }

        catch (error) {

          console.error(
            "Firebase Admin Login Error:",
            error
          );

          showMessage(
            friendlyError(error),
            "error"
          );

        }

        finally {

          loginButton.disabled =
            false;

          loginButton.textContent =
            "Login to Admin Panel";

        }

      }
    );


    /* =========================================================
       FRIENDLY FIREBASE ERROR
    ========================================================= */

    function friendlyError(error) {

      if (!error) {

        return (
          "Login করা যায়নি। আবার চেষ্টা করুন।"
        );

      }


      const code =
        error.code || "";


      console.error(
        "Firebase error code:",
        code
      );


      if (
        code ===
        "auth/invalid-email"
      ) {

        return (
          "সঠিক Admin Email দিন।"
        );

      }


      if (
        code ===
        "auth/invalid-credential" ||
        code ===
        "auth/wrong-password" ||
        code ===
        "auth/user-not-found"
      ) {

        return (
          "Email অথবা Password সঠিক নয়।"
        );

      }


      if (
        code ===
        "auth/user-disabled"
      ) {

        return (
          "এই Admin account disabled করা হয়েছে।"
        );

      }


      if (
        code ===
        "auth/too-many-requests"
      ) {

        return (
          "অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।"
        );

      }


      if (
        code ===
        "auth/network-request-failed"
      ) {

        return (
          "Internet connection পরীক্ষা করুন।"
        );

      }


      if (
        code ===
        "auth/operation-not-allowed"
      ) {

        return (
          "Firebase Authentication-এর Email/Password provider চালু নেই।"
        );

      }


      if (
        code ===
        "permission-denied"
      ) {

        return (
          "Firestore permission denied. users/{UID}-এর read permission এবং role check করুন।"
        );

      }


      if (
        code ===
        "failed-precondition"
      ) {

        return (
          "Firebase configuration বা Firestore setup অসম্পূর্ণ।"
        );

      }


      return (
        "Login করা যায়নি: " +
        (
          error.message ||
          "Unknown Firebase error"
        )
      );

    }


    /* =========================================================
       GLOBAL ERROR DIAGNOSTIC
    ========================================================= */

    window.addEventListener(
      "error",
      function(event) {

        console.error(
          "Page error:",
          event.error ||
          event.message
        );

      }
    );


    window.addEventListener(
      "unhandledrejection",
      function(event) {

        console.error(
          "Unhandled Promise error:",
          event.reason
        );

      }
    );


    console.log(
      "======================================"
    );

    console.log(
      "Milon Mela Admin Login — FIXED"
    );

    console.log(
      "Firebase Project:",
      firebaseConfig.projectId
    );

    console.log(
      "Email/Password Authentication: READY"
    );

    console.log(
      "Admin Role Verification: READY"
    );

    console.log(
      "======================================"
    );

  </script>

</body>
</html>
