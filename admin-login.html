<!DOCTYPE html>

<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    font-family:
        Arial,

        linear-gradient(

.login-card {

    width: 100%;

h1 {

    margin: 0;

    text-align: center;

}

    color: #667085;

}

    display: flex;

    align-items: center;

    display: block;

</head>


<body>


<div class="login-card">


    <div class="logo">
        🛍️
    </div>


    <h1>
        Admin Login
    </h1>


    <p class="subtitle">

        Shopping Mela Admin Dashboard-এ
        প্রবেশ করতে Login করুন।

    </p>


    <div class="admin-badge">

        <span class="verified">
            ✓
        </span>

        Verified Admin Access

    </div>


    <div
        class="message"
        id="message"
    ></div>


    <form
        id="loginForm"
        autocomplete="on"
    >


        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Admin username"
                autocomplete="username"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>


            <div class="input-wrap">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Admin password"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="button"
                    class="toggle-password"
                    id="togglePassword"
                    aria-label="Show password"
                >
                    👁️
                </button>

            </div>


            <div class="forgot-row">

                <a
                    href="admin-recovery.html"
                    class="forgot-link"
                >
                    Forgot Password?
                </a>

            </div>

        </div>


        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >
            🔐 Login to Admin
        </button>


    </form>


    <div class="security">

        🔒 আপনার Admin panel protected।

        <br>

        শুধুমাত্র authorized administrator
        access করার জন্য এই login system।

    </div>


    <a
        href="index.html"
        class="back-site"
    >
        ← Back to Shopping Mela
    </a>


</div>



<script>

/* =====================================================
   1.44 — ADMIN LOGIN CONNECTION
===================================================== */


const SESSION_KEY =
    "shoppingMelaAdminLoggedIn";


const LOGIN_TIME_KEY =
    "shoppingMelaAdminLoginTime";


const ADMIN_USERNAME =
    "admin";


const ADMIN_PASSWORD =
    "admin123";


const SESSION_DURATION =
    24 * 60 * 60 * 1000;



/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
    document.getElementById(
        "loginForm"
    );


const usernameInput =
    document.getElementById(
        "username"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginBtn =
    document.getElementById(
        "loginBtn"
    );


const messageBox =
    document.getElementById(
        "message"
    );


const togglePassword =
    document.getElementById(
        "togglePassword"
    );



/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
) {

    messageBox.textContent =
        text;

    messageBox.className =
        "message show " + type;

}



/* =====================================================
   HIDE MESSAGE
===================================================== */

function hideMessage() {

    messageBox.textContent = "";

    messageBox.className =
        "message";

}



/* =====================================================
   PASSWORD TOGGLE
===================================================== */

togglePassword.addEventListener(
    "click",
    function () {

        const isPassword =
            passwordInput.type ===
            "password";


        passwordInput.type =
            isPassword
            ? "text"
            : "password";


        this.textContent =
            isPassword
            ? "🙈"
            : "👁️";


        this.setAttribute(
            "aria-label",
            isPassword
            ? "Hide password"
            : "Show password"
        );

    }
);



/* =====================================================
   EXISTING SESSION CHECK
===================================================== */

function checkExistingSession() {

    const loggedIn =
        sessionStorage.getItem(
            SESSION_KEY
        );


    const loginTime =
        Number(
            sessionStorage.getItem(
                LOGIN_TIME_KEY
            ) || 0
        );


    if (
        loggedIn !== "true" ||
        !loginTime
    ) {

        return;

    }


    const sessionAge =
        Date.now() - loginTime;


    if (
        sessionAge >=
        SESSION_DURATION
    ) {

        sessionStorage.removeItem(
            SESSION_KEY
        );

        sessionStorage.removeItem(
            LOGIN_TIME_KEY
        );

        return;

    }


    showMessage(
        "আপনি ইতিমধ্যে Login করা আছেন। Dashboard-এ নেওয়া হচ্ছে...",
        "info"
    );


    setTimeout(
        function () {

            window.location.replace(
                "admin.html"
            );

        },
        700
    );

}



/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    function (event) {

        event.preventDefault();


        hideMessage();


        const username =
            usernameInput.value.trim();


        const password =
            passwordInput.value;


        if (!username) {

            showMessage(
                "Username দিন।",
                "error"
            );

            usernameInput.focus();

            return;

        }


        if (!password) {

            showMessage(
                "Password দিন।",
                "error"
            );

            passwordInput.focus();

            return;

        }


        loginBtn.disabled = true;

        loginBtn.textContent =
            "⏳ Checking...";


        setTimeout(
            function () {

                if (
                    username ===
                    ADMIN_USERNAME &&
                    password ===
                    ADMIN_PASSWORD
                ) {


                    /* =============================
                       CREATE ADMIN SESSION
                    ============================== */

                    sessionStorage.setItem(
                        SESSION_KEY,
                        "true"
                    );


                    sessionStorage.setItem(
                        LOGIN_TIME_KEY,
                        String(
                            Date.now()
                        )
                    );


                    showMessage(
                        "Login successful ✓ Dashboard-এ নেওয়া হচ্ছে...",
                        "success"
                    );


                    loginBtn.textContent =
                        "✓ Login Successful";


                    setTimeout(
                        function () {

                            window.location.replace(
                                "admin.html"
                            );

                        },
                        500
                    );


                } else {


                    /* =============================
                       INVALID LOGIN
                    ============================== */

                    showMessage(
                        "Username অথবা Password সঠিক নয়।",
                        "error"
                    );


                    loginBtn.disabled =
                        false;


                    loginBtn.textContent =
                        "🔐 Login to Admin";


                    passwordInput.value = "";

                    passwordInput.focus();

                }

            },
            450
        );

    }
);



/* =====================================================
   ENTER KEY SUPPORT
===================================================== */

usernameInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            passwordInput.focus();

        }

    }
);



/* =====================================================
   PAGE LOAD
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        checkExistingSession();

    }
);

</script>


</body>

</html>
