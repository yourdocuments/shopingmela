<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Milon Mela | Admin Login</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(
          circle at top left,
          rgba(255,107,0,.18),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(255,107,0,.12),
          transparent 35%
        ),
        #f5f6f8;

      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .login-wrapper{
      width:100%;
      max-width:430px;
    }

    .login-card{
      background:#fff;
      border-radius:24px;
      padding:32px 28px;
      box-shadow:0 18px 50px rgba(0,0,0,.12);
      border:1px solid rgba(0,0,0,.06);
    }

    .brand{
      text-align:center;
      margin-bottom:28px;
    }

    .brand img{
      width:82px;
      height:82px;
      object-fit:contain;
      margin-bottom:12px;
    }

    .brand h1{
      font-size:28px;
      color:#ff6b00;
      margin-bottom:6px;
    }

    .brand p{
      color:#777;
      font-size:14px;
    }

    .admin-badge{
      display:inline-block;
      margin-top:12px;
      background:#fff1e8;
      color:#ff6b00;
      padding:7px 14px;
      border-radius:50px;
      font-size:13px;
      font-weight:bold;
    }

    .form-group{
      margin-bottom:18px;
    }

    label{
      display:block;
      font-size:14px;
      font-weight:bold;
      margin-bottom:8px;
      color:#333;
    }

    .input-box{
      position:relative;
    }

    input{
      width:100%;
      padding:14px 45px 14px 15px;
      border:1px solid #ddd;
      border-radius:13px;
      outline:none;
      font-size:15px;
      background:#fafafa;
      transition:.2s;
    }

    input:focus{
      border-color:#ff6b00;
      background:#fff;
      box-shadow:
        0 0 0 3px rgba(255,107,0,.10);
    }

    .input-icon{
      position:absolute;
      right:15px;
      top:50%;
      transform:translateY(-50%);
      color:#999;
      font-size:18px;
      pointer-events:none;
    }

    .password-toggle{
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:transparent;
      cursor:pointer;
      color:#777;
      font-size:16px;
      padding:5px;
    }

    .login-btn{
      width:100%;
      border:0;
      border-radius:13px;
      padding:15px;
      background:#ff6b00;
      color:#fff;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:.2s;
      margin-top:5px;
    }

    .login-btn:hover{
      background:#e85f00;
      transform:translateY(-1px);
    }

    .login-btn:disabled{
      opacity:.65;
      cursor:not-allowed;
      transform:none;
    }

    .message{
      display:none;
      padding:12px 14px;
      border-radius:12px;
      margin-bottom:18px;
      font-size:14px;
      line-height:1.5;
      word-break:break-word;
    }

    .message.error{
      display:block;
      background:#fff0f0;
      color:#c62828;
      border:1px solid #ffd1d1;
    }

    .message.success{
      display:block;
      background:#effbf3;
      color:#218838;
      border:1px solid #ccebd5;
    }

    .security-box{
      margin-top:20px;
      padding:12px 14px;
      border-radius:12px;
      background:#f8f9fa;
      color:#666;
      font-size:12px;
      text-align:center;
    }

    .bottom-info{
      text-align:center;
      margin-top:22px;
      color:#888;
      font-size:12px;
      line-height:1.6;
    }

    .loading{
      display:inline-flex;
      align-items:center;
      gap:8px;
      justify-content:center;
    }

    .spinner{
      width:16px;
      height:16px;
      border:2px solid rgba(255,255,255,.4);
      border-top-color:#fff;
      border-radius:50%;
      animation:spin .7s linear infinite;
    }

    .page-spinner{
      width:30px;
      height:30px;
      border:3px solid #eee;
      border-top-color:#ff6b00;
      border-radius:50%;
      animation:spin .7s linear infinite;
      margin:0 auto 12px;
    }

    .checking{
      position:fixed;
      inset:0;
      background:#f5f6f8;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:10;
    }

    .checking-box{
      background:#fff;
      padding:30px;
      border-radius:18px;
      text-align:center;
      box-shadow:0 12px 35px rgba(0,0,0,.08);
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    @media(max-width:480px){

      .login-card{
        padding:26px 20px;
        border-radius:20px;
      }

      .brand h1{
        font-size:25px;
      }

    }
  </style>
</head>

<body>

  <!-- Firebase checking screen -->

  <div class="checking" id="checkingScreen">

    <div class="checking-box">

      <div class="page-spinner"></div>

      <strong>
        Checking Admin Login...
      </strong>

      <p style="color:#777;font-size:13px;margin-top:7px">
        Please wait
      </p>

    </div>

  </div>


  <!-- Login -->

  <div
    class="login-wrapper"
    id="loginWrapper"
    style="display:none"
  >

    <div class="login-card">

      <!-- Brand -->

      <div class="brand">

        <img
          src="./assets/icon/192MILONMELA.svg.svg"
          alt="Milon Mela"
          onerror="this.style.display='none'"
        >

        <h1>
          Milon Mela
        </h1>

        <p>
          Smart Local Marketplace
        </p>

        <div class="admin-badge">
          🔐 Admin Panel
        </div>

      </div>


      <!-- Message -->

      <div
        id="messageBox"
        class="message"
      ></div>


      <!-- Login Form -->

      <form
        id="adminLoginForm"
        novalidate
      >

        <!-- Email -->

        <div class="form-group">

          <label for="adminEmail">
            Admin Email
          </label>

          <div class="input-box">

            <input
              type="email"
              id="adminEmail"
              placeholder="admin@example.com"
              autocomplete="username"
              required
            >

            <span class="input-icon">
              ✉
            </span>

          </div>

        </div>


        <!-- Password -->

        <div class="form-group">

          <label for="adminPassword">
            Password
          </label>

          <div class="input-box">

            <input
              type="password"
              id="adminPassword"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="togglePassword"
              aria-label="Show password"
            >
              👁
            </button>

          </div>

        </div>


        <!-- Login Button -->

        <button
          type="submit"
          class="login-btn"
          id="loginButton"
        >
          Login to Admin Panel
        </button>

      </form>


      <!-- Security -->

      <div class="security-box">

        🔒 Secure login powered by Firebase Authentication

      </div>


      <!-- Bottom -->

      <div class="bottom-info">

        Milon Mela Admin System
        <br>

        Authorized administrators only

      </div>

    </div>

  </div>


  <!-- Firebase -->

  <script type="module">

    /*
    =========================================================
    MILON MELA ADMIN LOGIN
    Firebase Authentication + Firestore Admin Role
    =========================================================
    */


    /* =========================================================
       FIREBASE IMPORT
    ========================================================= */

    import {
      initializeApp
    }
    from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence,
      onAuthStateChanged,
      signOut
    }
    from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
      getFirestore,
      doc,
      getDoc
    }
    from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /* =========================================================
       FIREBASE CONFIG
    ========================================================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyA8Ixnp_UKTQoLQ1PW8vk6Uz5eUplDF8ag",

      authDomain:
        "milonmelay.firebaseapp.com",

      projectId:
        "milonmelay",

      storageBucket:
        "milonmelay.firebasestorage.app",

      messagingSenderId:
        "1047973064469",

      appId:
        "1:1047973064469:web:8cfa4ad0ec123df8d4431c",

      measurementId:
        "G-6N9HYS9GKN"

    };


    /* =========================================================
       ADMIN UID
    ========================================================= */

    const EXPECTED_ADMIN_UID =
      "tOgnS7B60Cg7wHrnFjwpYbPD62h2";


    /* =========================================================
       INITIALIZE FIREBASE
    ========================================================= */

    let app;
    let auth;
    let db;


    try {

      app =
        initializeApp(firebaseConfig);

      auth =
        getAuth(app);

      db =
        getFirestore(app);


      console.log(
        "Milon Mela Firebase initialized successfully."
      );


    }
    catch(error){

      console.error(
        "Firebase initialization error:",
        error
      );

      document.getElementById(
        "checkingScreen"
      ).style.display = "none";


      document.getElementById(
        "loginWrapper"
      ).style.display = "block";


      showMessage(
        "Firebase initialize হয়নি। Internet এবং Firebase configuration check করুন।",
        "error"
      );

    }


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const checkingScreen =
      document.getElementById(
        "checkingScreen"
      );


    const loginWrapper =
      document.getElementById(
        "loginWrapper"
      );


    const loginForm =
      document.getElementById(
        "adminLoginForm"
      );


    const emailInput =
      document.getElementById(
        "adminEmail"
      );


    const passwordInput =
      document.getElementById(
        "adminPassword"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );


    const messageBox =
      document.getElementById(
        "messageBox"
      );


    const togglePassword =
      document.getElementById(
        "togglePassword"
      );


    /* =========================================================
       MESSAGE
    ========================================================= */

    function showMessage(
      message,
      type
    ){

      messageBox.textContent =
        message;

      messageBox.className =
        "message " + type;

    }


    function hideMessage(){

      messageBox.textContent =
        "";

      messageBox.className =
        "message";

    }


    /* =========================================================
       SHOW LOGIN
    ========================================================= */

    function showLoginPage(){

      checkingScreen.style.display =
        "none";

      loginWrapper.style.display =
        "block";

    }


    /* =========================================================
       PASSWORD TOGGLE
    ========================================================= */

    togglePassword.addEventListener(
      "click",
      function(){

        if(
          passwordInput.type ===
          "password"
        ){

          passwordInput.type =
            "text";

          togglePassword.textContent =
            "🙈";

          togglePassword.setAttribute(
            "aria-label",
            "Hide password"
          );

        }
        else{

          passwordInput.type =
            "password";

          togglePassword.textContent =
            "👁";

          togglePassword.setAttribute(
            "aria-label",
            "Show password"
          );

        }

      }
    );


    /* =========================================================
       ADMIN CHECK
    ========================================================= */

    async function checkAdmin(
      user
    ){

      if(!user){

        return {
          allowed:false,
          reason:"no-user"
        };

      }


      console.log(
        "Current Firebase UID:",
        user.uid
      );


      console.log(
        "Expected Admin UID:",
        EXPECTED_ADMIN_UID
      );


      /*
      ---------------------------------------------------------
      IMPORTANT
      ---------------------------------------------------------
      The logged-in Firebase account must have this UID.
      ---------------------------------------------------------
      */

      if(
        user.uid !==
        EXPECTED_ADMIN_UID
      ){

        console.warn(
          "UID mismatch."
        );

        return {
          allowed:false,
          reason:"uid-mismatch"
        };

      }


      /* =======================================================
         FIRESTORE ADMIN DOCUMENT
      ======================================================= */

      const adminRef =
        doc(
          db,
          "users",
          user.uid
        );


      const adminSnap =
        await getDoc(
          adminRef
        );


      if(
        !adminSnap.exists()
      ){

        console.warn(
          "Admin user document not found."
        );

        return {
          allowed:false,
          reason:"document-not-found"
        };

      }


      const adminData =
        adminSnap.data();


      console.log(
        "Admin Firestore data:",
        adminData
      );


      if(
        adminData.role !==
        "admin"
      ){

        console.warn(
          "Firestore role is not admin."
        );

        return {
          allowed:false,
          reason:"not-admin"
        };

      }


      return {
        allowed:true,
        reason:"success"
      };

    }


    /* =========================================================
       EXISTING LOGIN SESSION
    ========================================================= */

    if(auth){

      setPersistence(
        auth,
        browserLocalPersistence
      )
      .then(function(){

        onAuthStateChanged(
          auth,
          async function(user){

            try{

              if(!user){

                showLoginPage();

                return;

              }


              console.log(
                "Existing Firebase user:",
                user.email
              );


              const result =
                await checkAdmin(
                  user
                );


              if(
                result.allowed
              ){

                console.log(
                  "Existing Admin session confirmed."
                );


                window.location.replace(
                  "admin-dashboard.html"
                );


                return;

              }


              /*
              --------------------------------------------------
              Logged in but not allowed
              --------------------------------------------------
              */

              await signOut(auth);

              showLoginPage();


              if(
                result.reason ===
                "uid-mismatch"
              ){

                showMessage(
                  "এই Firebase account Admin account নয়। সঠিক Admin Email দিয়ে Login করুন।",
                  "error"
                );

              }
              else if(
                result.reason ===
                "document-not-found"
              ){

                showMessage(
                  "Firestore users document পাওয়া যায়নি। এই UID-এর document তৈরি করুন এবং role: admin দিন।",
                  "error"
                );

              }
              else{

                showMessage(
                  "এই account-এর Admin access নেই।",
                  "error"
                );

              }

            }
            catch(error){

              console.error(
                "Existing session error:",
                error
              );


              showLoginPage();


              showMessage(
                friendlyError(error),
                "error"
              );

            }

          }
        );

      })
      .catch(function(error){

        console.error(
          "Persistence error:",
          error
        );

        showLoginPage();

        showMessage(
          friendlyError(error),
          "error"
        );

      });

    }


    /* =========================================================
       LOGIN
    ========================================================= */

    loginForm.addEventListener(
      "submit",
      async function(event){

        event.preventDefault();

        hideMessage();


        const email =
          emailInput.value.trim();


        const password =
          passwordInput.value;


        /* =====================================================
           VALIDATION
        ===================================================== */

        if(!email){

          showMessage(
            "Admin Email দিন।",
            "error"
          );

          emailInput.focus();

          return;

        }


        if(!password){

          showMessage(
            "Password দিন।",
            "error"
          );

          passwordInput.focus();

          return;

        }


        /* =====================================================
           BUTTON LOADING
        ===================================================== */

        loginButton.disabled =
          true;


        loginButton.innerHTML = `
          <span class="loading">
            <span class="spinner"></span>
            Logging in...
          </span>
        `;


        try{

          console.log(
            "Starting Firebase Admin Login..."
          );


          /* ===================================================
             PERSISTENT LOGIN
          =================================================== */

          await setPersistence(
            auth,
            browserLocalPersistence
          );


          /* ===================================================
             FIREBASE LOGIN
          =================================================== */

          const credential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            credential.user;


          console.log(
            "Firebase authentication successful:",
            user.email
          );


          console.log(
            "Logged-in UID:",
            user.uid
          );


          /* ===================================================
             ADMIN CHECK
          =================================================== */

          const result =
            await checkAdmin(
              user
            );


          /* ===================================================
             ADMIN NOT ALLOWED
          =================================================== */

          if(
            !result.allowed
          ){

            await signOut(auth);


            if(
              result.reason ===
              "uid-mismatch"
            ){

              showMessage(
                "Login হয়েছে, কিন্তু এই Firebase account-এর UID Admin UID-এর সাথে মিলছে না। Current UID: " +
                user.uid,
                "error"
              );

            }
            else if(
              result.reason ===
              "document-not-found"
            ){

              showMessage(
                "Login হয়েছে, কিন্তু Firestore users/" +
                user.uid +
                " document পাওয়া যায়নি। সেখানে role: admin দিন।",
                "error"
              );

            }
            else if(
              result.reason ===
              "not-admin"
            ){

              showMessage(
                "Login হয়েছে, কিন্তু Firestore users/" +
                user.uid +
                " document-এর role admin নয়।",
                "error"
              );

            }
            else{

              showMessage(
                "এই account-এর Admin access নেই।",
                "error"
              );

            }


            return;

          }


          /* ===================================================
             SUCCESS
          =================================================== */

          showMessage(
            "Admin Login successful. Dashboard খুলছে...",
            "success"
          );


          console.log(
            "ADMIN LOGIN SUCCESS"
          );


          setTimeout(
            function(){

              window.location.replace(
                "admin-dashboard.html"
              );

            },
            500
          );

        }
        catch(error){

          console.error(
            "Firebase Admin Login Error:",
            error
          );


          showMessage(
            friendlyError(error),
            "error"
          );

        }
        finally{

          loginButton.disabled =
            false;


          loginButton.textContent =
            "Login to Admin Panel";

        }

      }
    );


    /* =========================================================
       FIREBASE ERROR
    ========================================================= */

    function friendlyError(
      error
    ){

      if(!error){

        return(
          "Login করা যায়নি। আবার চেষ্টা করুন।"
        );

      }


      const code =
        error.code || "";


      console.error(
        "Firebase error code:",
        code
      );


      if(
        code ===
        "auth/invalid-email"
      ){

        return(
          "সঠিক Admin Email দিন।"
        );

      }


      if(
        code ===
        "auth/invalid-credential" ||

        code ===
        "auth/wrong-password" ||

        code ===
        "auth/user-not-found"
      ){

        return(
          "Email অথবা Password সঠিক নয়।"
        );

      }


      if(
        code ===
        "auth/user-disabled"
      ){

        return(
          "এই Admin account disabled করা হয়েছে।"
        );

      }


      if(
        code ===
        "auth/too-many-requests"
      ){

        return(
          "অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।"
        );

      }


      if(
        code ===
        "auth/network-request-failed"
      ){

        return(
          "Internet connection পরীক্ষা করুন।"
        );

      }


      if(
        code ===
        "auth/operation-not-allowed"
      ){

        return(
          "Firebase Authentication-এর Email/Password provider চালু নেই।"
        );

      }


      if(
        code ===
        "permission-denied"
      ){

        return(
          "Firestore permission denied। Firestore Rules check করুন।"
        );

      }


      return(
        "Login করা যায়নি: " +
        (
          error.message ||
          "Unknown Firebase error"
        )
      );

    }


    /* =========================================================
       GLOBAL ERROR LOG
    ========================================================= */

    window.addEventListener(
      "error",
      function(event){

        console.error(
          "Page error:",
          event.error ||
          event.message
        );

      }
    );


    window.addEventListener(
      "unhandledrejection",
      function(event){

        console.error(
          "Unhandled Promise error:",
          event.reason
        );

      }
    );


    /* =========================================================
       CONSOLE INFO
    ========================================================= */

    console.log(
      "======================================"
    );

    console.log(
      "Milon Mela Admin Login"
    );

    console.log(
      "Firebase Project: milonmelay"
    );

    console.log(
      "Expected Admin UID:",
      EXPECTED_ADMIN_UID
    );

    console.log(
      "Email/Password Authentication: READY"
    );

    console.log(
      "Firestore Admin Role Verification: READY"
    );

    console.log(
      "======================================"
    );

  </script>

</body>
</html>
