<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login — Shopping Mela</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                "Noto Sans Bengali",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef5ff,
                    #f8fafc
                );

            display: flex;

            align-items: center;

            justify-content: center;

            color: #101828;

            padding: 20px;

        }


        .login-wrapper {

            width: 100%;

            max-width: 410px;

        }


        /* LOGO */

        .brand {

            text-align: center;

            margin-bottom: 22px;

        }


        .brand-icon {

            width: 55px;

            height: 55px;

            margin: 0 auto 10px;

            border-radius: 14px;

            background: #1877f2;

            color: #ffffff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 26px;

            box-shadow:
                0 8px 25px
                rgba(24,119,242,.20);

        }


        .brand h1 {

            margin: 0;

            font-size: 22px;

            font-weight: 800;

        }


        .brand p {

            margin: 6px 0 0;

            color: #667085;

            font-size: 10px;

        }


        /* CARD */

        .login-card {

            background: #ffffff;

            border:
                1px solid #e4e7ec;

            border-radius: 16px;

            padding: 28px;

            box-shadow:
                0 15px 45px
                rgba(16,24,40,.08);

        }


        .login-title {

            margin-bottom: 22px;

        }


        .login-title h2 {

            margin: 0;

            font-size: 18px;

        }


        .login-title p {

            margin: 6px 0 0;

            color: #98a2b3;

            font-size: 9px;

        }


        /* FORM */

        .form-group {

            margin-bottom: 16px;

        }


        .form-group label {

            display: block;

            margin-bottom: 6px;

            color: #344054;

            font-size: 9px;

            font-weight: 700;

        }


        .input-wrap {

            position: relative;

        }


        .input-icon {

            position: absolute;

            left: 12px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 14px;

            opacity: .65;

        }


        .form-group input {

            width: 100%;

            height: 43px;

            padding:
                0 40px;

            border:
                1px solid #d0d5dd;

            border-radius: 8px;

            outline: none;

            font-size: 11px;

            color: #101828;

            transition: .2s;

        }


        .form-group input:focus {

            border-color: #1877f2;

            box-shadow:
                0 0 0 3px
                rgba(24,119,242,.10);

        }


        .password-toggle {

            position: absolute;

            right: 11px;

            top: 50%;

            transform:
                translateY(-50%);

            border: 0;

            background: transparent;

            cursor: pointer;

            font-size: 14px;

            opacity: .65;

        }


        /* REMEMBER */

        .login-options {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 18px;

        }


        .remember {

            display: flex;

            align-items: center;

            gap: 6px;

            color: #667085;

            font-size: 9px;

        }


        .remember input {

            accent-color: #1877f2;

        }


        /* BUTTON */

        .login-btn {

            width: 100%;

            height: 44px;

            border: 0;

            border-radius: 8px;

            background: #1877f2;

            color: #ffffff;

            cursor: pointer;

            font-size: 11px;

            font-weight: 800;

            transition: .2s;

        }


        .login-btn:hover {

            background: #0f6ae8;

        }


        .login-btn:active {

            transform: scale(.99);

        }


        .login-btn.loading {

            opacity: .7;

            pointer-events: none;

        }


        /* ERROR */

        .error-box {

            display: none;

            margin-bottom: 15px;

            padding: 10px;

            border-radius: 7px;

            background: #fef3f2;

            border:
                1px solid #fecdca;

            color: #b42318;

            font-size: 9px;

            line-height: 1.5;

        }


        .error-box.show {

            display: block;

        }


        /* SUCCESS */

        .success-box {

            display: none;

            margin-bottom: 15px;

            padding: 10px;

            border-radius: 7px;

            background: #ecfdf3;

            border:
                1px solid #abefc6;

            color: #067647;

            font-size: 9px;

            line-height: 1.5;

        }


        .success-box.show {

            display: block;

        }


        /* BACK */

        .back-site {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #667085;

            text-decoration: none;

            font-size: 9px;

        }


        .back-site:hover {

            color: #1877f2;

        }


        /* SECURITY */

        .security-note {

            margin-top: 18px;

            padding: 10px;

            border-radius: 8px;

            background: #f9fafb;

            color: #98a2b3;

            text-align: center;

            font-size: 8px;

            line-height: 1.5;

        }


        /* FOOTER */

        .footer {

            text-align: center;

            margin-top: 20px;

            color: #98a2b3;

            font-size: 8px;

        }


        /* MOBILE */

        @media (max-width: 480px) {

            body {

                padding: 14px;

            }


            .login-card {

                padding: 22px;

            }


            .brand h1 {

                font-size: 20px;

            }

        }

    </style>

</head>


<body>


<div class="login-wrapper">


    <!-- BRAND -->

    <div class="brand">

        <div class="brand-icon">
            🛍️
        </div>

        <h1>
            Shopping Mela
        </h1>

        <p>
            Admin Management System
        </p>

    </div>



    <!-- LOGIN CARD -->

    <div class="login-card">


        <div class="login-title">

            <h2>
                Admin Login
            </h2>

            <p>
                Continue to your admin dashboard
            </p>

        </div>



        <!-- ERROR -->

        <div
            class="error-box"
            id="errorBox"
        >
        </div>



        <!-- SUCCESS -->

        <div
            class="success-box"
            id="successBox"
        >
            Login successful। Dashboard
            খুলছে...
        </div>



        <!-- FORM -->

        <form
            id="loginForm"
            autocomplete="off"
        >


            <!-- USERNAME -->

            <div class="form-group">

                <label>
                    Admin Username
                </label>


                <div class="input-wrap">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter admin username"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    Password
                </label>


                <div class="input-wrap">

                    <span class="input-icon">
                        🔒
                    </span>


                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        👁️
                    </button>

                </div>

            </div>



            <!-- OPTIONS -->

            <div class="login-options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    Remember me

                </label>

            </div>



            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Login to Dashboard
            </button>


        </form>



        <!-- SECURITY -->

        <div class="security-note">

            🔐 Admin area protected by
            Shopping Mela authentication.

        </div>


    </div>



    <!-- BACK -->

    <a
        href="index.html"
        class="back-site"
    >
        ← Back to Shopping Mela
    </a>


    <div class="footer">

        © 2026 Shopping Mela.
        Admin Panel.

    </div>


</div>



<script>


/* =====================================================
   ADMIN LOGIN CONFIG
===================================================== */

/*
   DEMO LOGIN

   Username:
   admin

   Password:
   123456

   পরে চাইলে এগুলো আপনার নিজের
   username/password দিয়ে পরিবর্তন করবেন।
*/


const ADMIN_USERNAME =
    "admin";


const ADMIN_PASSWORD =
    "123456";



/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
    document.getElementById(
        "loginForm"
    );


const usernameInput =
    document.getElementById(
        "username"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const rememberMe =
    document.getElementById(
        "rememberMe"
    );


const loginBtn =
    document.getElementById(
        "loginBtn"
    );


const errorBox =
    document.getElementById(
        "errorBox"
    );


const successBox =
    document.getElementById(
        "successBox"
    );


const togglePassword =
    document.getElementById(
        "togglePassword"
    );



/* =====================================================
   PASSWORD SHOW / HIDE
===================================================== */

togglePassword.addEventListener(
    "click",
    function () {

        if (
            passwordInput.type ===
            "password"
        ) {

            passwordInput.type =
                "text";

            togglePassword.textContent =
                "🙈";

        } else {

            passwordInput.type =
                "password";

            togglePassword.textContent =
                "👁️";

        }

    }
);



/* =====================================================
   REMEMBERED USERNAME
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const savedUsername =
            localStorage.getItem(
                "shoppingMelaAdminUsername"
            );


        if (savedUsername) {

            usernameInput.value =
                savedUsername;

            rememberMe.checked =
                true;

        }

    }
);



/* =====================================================
   ERROR
===================================================== */

function showError(
    message
) {

    successBox.classList.remove(
        "show"
    );


    errorBox.textContent =
        message;


    errorBox.classList.add(
        "show"
    );

}



/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    function (event) {

        event.preventDefault();


        errorBox.classList.remove(
            "show"
        );


        const username =
            usernameInput.value.trim();


        const password =
            passwordInput.value;


        if (!username) {

            showError(
                "Admin username দিন।"
            );

            usernameInput.focus();

            return;

        }


        if (!password) {

            showError(
                "Password দিন।"
            );

            passwordInput.focus();

            return;

        }


        loginBtn.classList.add(
            "loading"
        );


        loginBtn.textContent =
            "Checking...";


        /*
            ছোট delay,
            যাতে login process natural লাগে।
        */

        setTimeout(
            function () {

                if (
                    username ===
                        ADMIN_USERNAME
                    &&
                    password ===
                        ADMIN_PASSWORD
                ) {

                    /*
                       Remember username
                    */

                    if (
                        rememberMe.checked
                    ) {

                        localStorage.setItem(
                            "shoppingMelaAdminUsername",
                            username
                        );

                    } else {

                        localStorage.removeItem(
                            "shoppingMelaAdminUsername"
                        );

                    }


                    /*
                       Admin session
                    */

                    sessionStorage.setItem(
                        "shoppingMelaAdminLoggedIn",
                        "true"
                    );


                    sessionStorage.setItem(
                        "shoppingMelaAdminLoginTime",
                        Date.now()
                    );


                    /*
                       Success
                    */

                    successBox.classList.add(
                        "show"
                    );


                    loginBtn.textContent =
                        "Login Successful ✓";


                    /*
                       Dashboard
                    */

                    setTimeout(
                        function () {

                            window.location.href =
                                "admin.html";

                        },
                        700
                    );


                } else {

                    loginBtn.classList.remove(
                        "loading"
                    );


                    loginBtn.textContent =
                        "Login to Dashboard";


                    showError(
                        "Username অথবা password সঠিক নয়।"
                    );


                    passwordInput.value =
                        "";


                    passwordInput.focus();

                }

            },
            500
        );

    }
);

</script>


</body>

</html>
```
