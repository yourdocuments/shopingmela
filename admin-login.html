<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Milon Mela | Admin Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255,107,0,0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(255,107,0,0.12), transparent 35%),
        #f5f6f8;

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 430px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.12);
      border: 1px solid rgba(0,0,0,0.06);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand img {
      width: 82px;
      height: 82px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    .brand h1 {
      font-size: 28px;
      color: #ff6b00;
      margin-bottom: 6px;
    }

    .brand p {
      color: #777;
      font-size: 14px;
    }

    .admin-badge {
      display: inline-block;
      margin-top: 12px;
      background: #fff1e8;
      color: #ff6b00;
      padding: 7px 14px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #333;
    }

    .input-box {
      position: relative;
    }

    .input-box input {
      width: 100%;
      padding: 14px 45px 14px 15px;
      border: 1px solid #ddd;
      border-radius: 13px;
      outline: none;
      font-size: 15px;
      background: #fafafa;
      transition: 0.2s;
    }

    .input-box input:focus {
      border-color: #ff6b00;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(255,107,0,0.10);
    }

    .input-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      font-size: 18px;
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      color: #777;
      font-size: 16px;
    }

    .login-btn {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 15px;
      background: #ff6b00;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 5px;
    }

    .login-btn:hover {
      background: #e85f00;
      transform: translateY(-1px);
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #c62828;
      border: 1px solid #ffd1d1;
    }

    .message.success {
      display: block;
      background: #effbf3;
      color: #218838;
      border: 1px solid #ccebd5;
    }

    .bottom-info {
      text-align: center;
      margin-top: 22px;
      color: #888;
      font-size: 12px;
      line-height: 1.6;
    }

    .security-box {
      margin-top: 20px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f8f9fa;
      color: #666;
      font-size: 12px;
      text-align: center;
    }

    .loading {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 26px 20px;
        border-radius: 20px;
      }

      .brand h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <div class="login-card">

      <div class="brand">

        <img
          src="./assets/icon/192MILONMELA.svg.svg"
          alt="Milon Mela"
          onerror="this.style.display='none';"
        >

        <h1>Milon Mela</h1>

        <p>Smart Local Marketplace</p>

        <div class="admin-badge">
          🔐 Admin Panel
        </div>

      </div>

      <div id="messageBox" class="message"></div>

      <form id="adminLoginForm">

        <div class="form-group">

          <label for="adminEmail">
            Admin Email
          </label>

          <div class="input-box">

            <input
              type="email"
              id="adminEmail"
              placeholder="admin@example.com"
              autocomplete="username"
              required
            >

            <span class="input-icon">✉</span>

          </div>

        </div>

        <div class="form-group">

          <label for="adminPassword">
            Password
          </label>

          <div class="input-box">

            <input
              type="password"
              id="adminPassword"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="togglePassword"
              aria-label="Show password"
            >
              👁
            </button>

          </div>

        </div>

        <button
          type="submit"
          class="login-btn"
          id="loginButton"
        >
          Login to Admin Panel
        </button>

      </form>

      <div class="security-box">
        🔒 Secure login powered by Firebase Authentication
      </div>

      <div class="bottom-info">
        Milon Mela Admin System<br>
        Authorized administrators only
      </div>

    </div>

  </div>


  <!-- Firebase Login -->
  <script type="module">

    import {
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import { auth } from "./firebase-config.js";


    const loginForm = document.getElementById("adminLoginForm");
    const emailInput = document.getElementById("adminEmail");
    const passwordInput = document.getElementById("adminPassword");
    const loginButton = document.getElementById("loginButton");
    const messageBox = document.getElementById("messageBox");
    const togglePassword = document.getElementById("togglePassword");


    /*
      ------------------------------------------------
      MESSAGE
      ------------------------------------------------
    */

    function showMessage(message, type) {

      messageBox.textContent = message;

      messageBox.className = "message " + type;

    }


    function hideMessage() {

      messageBox.textContent = "";

      messageBox.className = "message";

    }


    /*
      ------------------------------------------------
      PASSWORD SHOW / HIDE
      ------------------------------------------------
    */

    togglePassword.addEventListener("click", function () {

      if (passwordInput.type === "password") {

        passwordInput.type = "text";

        togglePassword.textContent = "🙈";

        togglePassword.setAttribute(
          "aria-label",
          "Hide password"
        );

      } else {

        passwordInput.type = "password";

        togglePassword.textContent = "👁";

        togglePassword.setAttribute(
          "aria-label",
          "Show password"
        );

      }

    });


    /*
      ------------------------------------------------
      CHECK EXISTING FIREBASE LOGIN
      ------------------------------------------------
    */

    onAuthStateChanged(auth, function (user) {

      if (user) {

        console.log(
          "Firebase Admin already signed in:",
          user.email
        );

        /*
          If admin is already logged in,
          go directly to dashboard.
        */

        window.location.href = "admin-dashboard.html";

      }

    });


    /*
      ------------------------------------------------
      LOGIN
      ------------------------------------------------
    */

    loginForm.addEventListener("submit", async function (event) {

      event.preventDefault();

      hideMessage();

      const email = emailInput.value.trim();

      const password = passwordInput.value;


      if (!email || !password) {

        showMessage(
          "Email এবং Password দুটিই দিন।",
          "error"
        );

        return;

      }


      loginButton.disabled = true;

      loginButton.innerHTML = `
        <span class="loading">
          <span class="spinner"></span>
          Logging in...
        </span>
      `;


      try {

        const userCredential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user = userCredential.user;


        console.log(
          "Firebase Admin Login Successful:",
          user.email
        );


        showMessage(
          "Login successful. Admin panel খুলছে...",
          "success"
        );


        /*
          Small delay so the user can see
          the success message.
        */

        setTimeout(function () {

          window.location.href =
            "admin-dashboard.html";

        }, 700);


      } catch (error) {

        console.error(
          "Firebase Login Error:",
          error
        );


        let errorMessage =
          "Login করা যায়নি। Email অথবা Password পরীক্ষা করুন।";


        if (error.code === "auth/invalid-email") {

          errorMessage =
            "সঠিক Admin Email দিন।";

        }

        else if (
          error.code === "auth/invalid-credential"
        ) {

          errorMessage =
            "Email অথবা Password সঠিক নয়।";

        }

        else if (
          error.code === "auth/user-disabled"
        ) {

          errorMessage =
            "এই Admin account disabled করা হয়েছে।";

        }

        else if (
          error.code === "auth/too-many-requests"
        ) {

          errorMessage =
            "অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";

        }

        else if (
          error.code === "auth/network-request-failed"
        ) {

          errorMessage =
            "Internet connection পরীক্ষা করুন।";

        }


        showMessage(
          errorMessage,
          "error"
        );


        loginButton.disabled = false;

        loginButton.textContent =
          "Login to Admin Panel";

      }

    });

  </script>

</body>
</html>
