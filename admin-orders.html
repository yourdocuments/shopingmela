<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Orders — Shopping Mela</title>

    <meta
        name="description"
        content="Shopping Mela Admin Order Management"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           ADMIN ORDERS
        ====================================================== */

        .admin-orders-page {

            min-height: 100vh;

            background: #f5f6f8;

            padding: 30px 0 60px;

        }


        .admin-orders-container {

            max-width: 1200px;

            margin: auto;

            padding: 0 20px;

        }


        /* =====================================================
           PAGE HEADER
        ====================================================== */

        .admin-page-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 25px;

        }


        .admin-page-header h1 {

            margin: 0;

            color: #101828;

            font-size: 28px;

            font-weight: 800;

        }


        .admin-page-header p {

            margin: 6px 0 0;

            color: #667085;

            font-size: 12px;

        }


        .admin-header-actions {

            display: flex;

            gap: 8px;

        }


        .admin-btn {

            border: 1px solid #d0d5dd;

            background: #ffffff;

            color: #344054;

            padding: 10px 14px;

            border-radius: 8px;

            cursor: pointer;

            font-family: inherit;

            font-size: 11px;

            font-weight: 800;

            text-decoration: none;

        }


        .admin-btn.primary {

            background: #1877f2;

            border-color: #1877f2;

            color: #ffffff;

        }


        .admin-btn.danger {

            color: #d92d20;

            border-color: #f1b5b5;

        }


        /* =====================================================
           STAT CARDS
        ====================================================== */

        .stats-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 22px;

        }


        .stat-card {

            background: #ffffff;

            border: 1px solid #e7eaf0;

            border-radius: 13px;

            padding: 18px;

            box-shadow:
                0 4px 15px
                rgba(16,24,40,.03);

        }


        .stat-icon {

            width: 38px;

            height: 38px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 9px;

            background: #eef5ff;

            font-size: 18px;

            margin-bottom: 10px;

        }


        .stat-card span {

            display: block;

            color: #667085;

            font-size: 10px;

            margin-bottom: 4px;

        }


        .stat-card strong {

            color: #101828;

            font-size: 22px;

        }


        /* =====================================================
           TOOLBAR
        ====================================================== */

        .orders-toolbar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            background: #ffffff;

            border: 1px solid #e7eaf0;

            border-radius: 13px;

            padding: 14px;

            margin-bottom: 15px;

        }


        .orders-search {

            flex: 1;

            max-width: 420px;

        }


        .orders-search input {

            width: 100%;

            box-sizing: border-box;

            border: 1px solid #d0d5dd;

            border-radius: 8px;

            padding: 11px 12px;

            outline: none;

            font-family: inherit;

            font-size: 11px;

        }


        .orders-search input:focus {

            border-color: #1877f2;

        }


        .filter-select {

            border: 1px solid #d0d5dd;

            border-radius: 8px;

            padding: 10px 12px;

            background: #ffffff;

            color: #344054;

            outline: none;

            font-family: inherit;

            font-size: 11px;

        }


        /* =====================================================
           ORDER CARD
        ====================================================== */

        .admin-order-card {

            background: #ffffff;

            border: 1px solid #e7eaf0;

            border-radius: 15px;

            overflow: hidden;

            margin-bottom: 15px;

            box-shadow:
                0 4px 16px
                rgba(16,24,40,.03);

        }


        .admin-order-top {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding: 17px 18px;

            background: #fafbfc;

            border-bottom:
                1px solid #eaecf0;

        }


        .admin-order-id strong {

            display: block;

            color: #101828;

            font-size: 14px;

        }


        .admin-order-date {

            display: block;

            margin-top: 4px;

            color: #667085;

            font-size: 9px;

        }


        .admin-status {

            display: inline-flex;

            align-items: center;

            padding: 7px 10px;

            border-radius: 20px;

            background: #eef5ff;

            color: #1877f2;

            font-size: 9px;

            font-weight: 800;

        }


        /* =====================================================
           ORDER BODY
        ====================================================== */

        .admin-order-body {

            padding: 18px;

        }


        .admin-order-grid {

            display: grid;

            grid-template-columns:
                1.3fr
                1fr
                220px;

            gap: 20px;

        }


        .admin-section-title {

            margin: 0 0 11px;

            color: #101828;

            font-size: 12px;

            font-weight: 800;

        }


        /* =====================================================
           CUSTOMER
        ====================================================== */

        .customer-info {

            background: #f8fafc;

            border: 1px solid #eaecf0;

            border-radius: 10px;

            padding: 13px;

        }


        .customer-row {

            display: flex;

            gap: 7px;

            margin-bottom: 7px;

            color: #667085;

            font-size: 10px;

            line-height: 1.4;

        }


        .customer-row:last-child {

            margin-bottom: 0;

        }


        .customer-row strong {

            color: #344054;

        }


        /* =====================================================
           PRODUCTS
        ====================================================== */

        .admin-products {

            display: grid;

            gap: 8px;

        }


        .admin-product {

            display: grid;

            grid-template-columns:
                45px
                1fr
                auto;

            align-items: center;

            gap: 9px;

        }


        .admin-product-image {

            width: 45px;

            height: 45px;

            border-radius: 7px;

            background:
                #f2f4f7
                center / cover
                no-repeat;

        }


        .admin-product-info h4 {

            margin: 0;

            color: #344054;

            font-size: 10px;

        }


        .admin-product-info p {

            margin: 3px 0 0;

            color: #98a2b3;

            font-size: 8px;

        }


        .admin-product-price {

            color: #101828;

            font-size: 10px;

            font-weight: 800;

        }


        /* =====================================================
           MANAGEMENT
        ====================================================== */

        .manage-box {

            border: 1px solid #eaecf0;

            border-radius: 10px;

            padding: 13px;

        }


        .manage-box label {

            display: block;

            margin-bottom: 6px;

            color: #667085;

            font-size: 9px;

            font-weight: 700;

        }


        .status-select {

            width: 100%;

            box-sizing: border-box;

            border: 1px solid #d0d5dd;

            border-radius: 7px;

            padding: 9px;

            background: #ffffff;

            color: #344054;

            font-family: inherit;

            font-size: 10px;

            outline: none;

            margin-bottom: 10px;

        }


        .status-select:focus {

            border-color: #1877f2;

        }


        .save-status {

            width: 100%;

            border: none;

            background: #1877f2;

            color: #ffffff;

            border-radius: 7px;

            padding: 9px;

            cursor: pointer;

            font-family: inherit;

            font-size: 9px;

            font-weight: 800;

        }


        .delete-order {

            width: 100%;

            margin-top: 7px;

            border: 1px solid #f1b5b5;

            background: #ffffff;

            color: #d92d20;

            border-radius: 7px;

            padding: 8px;

            cursor: pointer;

            font-family: inherit;

            font-size: 9px;

            font-weight: 700;

        }


        /* =====================================================
           TOTAL
        ====================================================== */

        .admin-order-footer {

            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: 20px;

            border-top:
                1px solid #eaecf0;

            margin-top: 17px;

            padding-top: 15px;

        }


        .admin-total-line {

            color: #667085;

            font-size: 10px;

        }


        .admin-total-line strong {

            color: #1877f2;

            font-size: 15px;

            margin-left: 5px;

        }


        /* =====================================================
           EMPTY
        ====================================================== */

        .admin-empty {

            display: none;

            background: #ffffff;

            border: 1px solid #e7eaf0;

            border-radius: 15px;

            padding: 60px 20px;

            text-align: center;

        }


        .admin-empty-icon {

            font-size: 38px;

            margin-bottom: 12px;

        }


        .admin-empty h2 {

            margin: 0 0 6px;

            color: #101828;

            font-size: 19px;

        }


        .admin-empty p {

            margin: 0;

            color: #667085;

            font-size: 11px;

        }


        /* =====================================================
           TOAST
        ====================================================== */

        .admin-toast {

            position: fixed;

            left: 50%;

            bottom: 25px;

            transform:
                translate(-50%, 20px);

            opacity: 0;

            pointer-events: none;

            background: #101828;

            color: #ffffff;

            padding: 11px 15px;

            border-radius: 9px;

            font-size: 10px;

            z-index: 9999;

            transition: .25s;

        }


        .admin-toast.show {

            opacity: 1;

            transform:
                translate(-50%, 0);

        }


        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 900px) {

            .stats-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .admin-order-grid {

                grid-template-columns:
                    1fr
                    1fr;

            }


            .manage-box {

                grid-column:
                    1 / -1;

            }

        }


        @media (max-width: 600px) {

            .admin-orders-container {

                padding: 0 12px;

            }


            .admin-page-header {

                align-items: flex-start;

                flex-direction: column;

            }


            .admin-header-actions {

                width: 100%;

            }


            .admin-btn {

                flex: 1;

                text-align: center;

            }


            .stats-grid {

                grid-template-columns:
                    1fr 1fr;

                gap: 9px;

            }


            .stat-card {

                padding: 13px;

            }


            .stat-card strong {

                font-size: 18px;

            }


            .orders-toolbar {

                align-items: stretch;

                flex-direction: column;

            }


            .orders-search {

                max-width: none;

            }


            .admin-order-top {

                align-items: flex-start;

                flex-direction: column;

            }


            .admin-order-grid {

                grid-template-columns: 1fr;

            }


            .manage-box {

                grid-column: auto;

            }


            .admin-order-footer {

                justify-content: space-between;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     TOP BAR
====================================================== -->

<div class="top-bar">

    🛍️ <span>Shopping Mela</span>
    — Admin Orders

</div>



<!-- =====================================================
     HEADER
====================================================== -->

<header class="header">

    <div class="container">

        <div class="header-main">

            <a

            >

                <div class="logo-icon">
                    🛍️
                </div>

                    Shopping Mela
                </span>

            </a>


            <div class="header-actions">

                <a

                    </span>

                    <span>

                    </span>

            </div>

    </div>

</header>



<!-- =====================================================
     MAIN
====================================================== -->

<main class="admin-orders-page">

    <div class="admin-orders-container">


        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="admin-page-header">

            <div>

                <h1>
                    Order Management
                </h1>

                <p>
                    Customer orders manage করুন এবং
                    delivery status update করুন।
                </p>

            </div>


            <div

            >

                <a

                    class="admin-btn"

                </a>

        <!-- =================================================

                <span>

        <!-- =================================================

        ================================================== -->

        <div class="orders-toolbar">

            <div class="orders-search">

                    type="search"

                <option value="1">

        <!-- =================================================

        <div

<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script>


/* =====================================================
   GLOBAL
===================================================== */

let orders = [];


const STATUS_NAMES = [

    "Order Placed",

    "Order Confirmed",

    "Processing",

    "Shipped",

    "Out for Delivery",

    "Delivered"

];



/* =====================================================
   LOAD
===================================================== */

function loadOrders() {

    try {

        orders =
            JSON.parse(
                localStorage.getItem(
                    "shoppingMelaOrders"
                )
            ) || [];

    } catch (error) {

        orders = [];

    }

}



/* =====================================================
   SAVE
===================================================== */

function saveOrders() {

    localStorage.setItem(
        "shoppingMelaOrders",
        JSON.stringify(
            orders
        )
    );

}



/* =====================================================
   MONEY
===================================================== */

function money(amount) {

    return "৳" +
        Number(
            amount || 0
        ).toLocaleString(
            "en-BD"
        );

}



/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value) {

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}



/* =====================================================
   DATE
===================================================== */

function formatDate(
    dateString
) {

    if (!dateString) {

        return "Date unavailable";

    }


    const date =
        new Date(
            dateString
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "Date unavailable";

    }


    return date.toLocaleDateString(
        "en-BD",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    )
    +
    " • "
    +
    date.toLocaleTimeString(
        "en-BD",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}



/* =====================================================
   PAYMENT
===================================================== */

function paymentName(
    value
) {

    const names = {

        cod:
            "Cash on Delivery",

        mobile:
            "Mobile Payment",

        bank:
            "Bank / Card"

    };


    return (
        names[value] ||
        value ||
        "Cash on Delivery"
    );

}



/* =====================================================
   STATUS
===================================================== */

function getStatus(
    order
) {

    const step =
        Number(
            order.trackingStep ?? 0
        );


    return Math.max(
        0,
        Math.min(
            5,
            step
        )
    );

}



/* =====================================================
   STATS
===================================================== */

function renderStats() {

    const total =
        orders.length;


    const pending =
        orders.filter(
            order =>
                getStatus(order) < 5
        ).length;


    const shipped =
        orders.filter(
            order =>
                getStatus(order) >= 3 &&
                getStatus(order) < 5
        ).length;


    const sales =
        orders.reduce(
            (
                sum,
                order
            ) => {

                return sum +
                    Number(
                        order.total ||
                        0
                    );

            },
            0
        );


    document.getElementById(
        "totalOrders"
    ).textContent =
        total;


    document.getElementById(
        "pendingOrders"
    ).textContent =
        pending;


    document.getElementById(
        "shippedOrders"
    ).textContent =
        shipped;


    document.getElementById(
        "totalSales"
    ).textContent =
        money(
            sales
        );

}



/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders() {

    const list =
        document.getElementById(
            "adminOrdersList"
        );


    const empty =
        document.getElementById(
            "adminEmpty"
        );


    const search =
        document.getElementById(
            "orderSearch"
        )
        .value
        .trim()
        .toLowerCase();


    const filter =
        document.getElementById(
            "statusFilter"
        )
        .value;


    list.innerHTML = "";


    const filtered =
        orders
            .map(
                (
                    order,
                    index
                ) => ({
                    order,
                    index
                })
            )
            .filter(
                item => {

                    const order =
                        item.order;


                    const customer =
                        order.customer ||
                        {};


                    const searchable =
                        [
                            order.orderId,

                            customer.name,

                            customer.phone,

                            customer.district

                        ]
                        .join(" ")
                        .toLowerCase();


                    const matchesSearch =
                        !search ||
                        searchable.includes(
                            search
                        );


                    const matchesStatus =
                        filter === "all" ||
                        String(
                            getStatus(order)
                        ) === filter;


                    return (
                        matchesSearch &&
                        matchesStatus
                    );

                }
            )
            .reverse();


    if (!filtered.length) {

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    filtered.forEach(
        item => {

            list.appendChild(
                createOrderCard(
                    item.order,
                    item.index
                )
            );

        }
    );

}



/* =====================================================
   CREATE CARD
===================================================== */

function createOrderCard(
    order,
    originalIndex
) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "admin-order-card";


    const customer =
        order.customer ||
        {};


    const products =
        Array.isArray(
            order.products
        )
        ? order.products
        : [];


    const step =
        getStatus(
            order
        );


    const productHTML =
        products
            .map(
                item => {

                    const quantity =
                        Number(
                            item.quantity ||
                            1
                        );


                    const total =
                        Number(
                            item.price ||
                            0
                        ) *
                        quantity;


                    return `

                        <div
                            class="admin-product"
                        >

                            <div
                                class="admin-product-image"
                                style="
                                    background-image:
                                    url('${escapeHTML(
                                        item.image
                                    )}');
                                "
                            ></div>


                            <div
                                class="admin-product-info"
                            >

                                <h4>
                                    ${escapeHTML(
                                        item.name
                                    )}
                                </h4>

                                <p>
                                    ${quantity}
                                    ×
                                    ${money(
                                        item.price
                                    )}
                                </p>

                            </div>


                            <div
                                class="admin-product-price"
                            >
                                ${money(total)}
                            </div>

                        </div>

                    `;

                }
            )
            .join("");


    card.innerHTML = `

        <!-- TOP -->

        <div
            class="admin-order-top"
        >

            <div
                class="admin-order-id"
            >

                <strong>
                    #${escapeHTML(
                        order.orderId ||
                        "SM000000"
                    )}
                </strong>

                <span
                    class="admin-order-date"
                >
                    ${formatDate(
                        order.createdAt
                    )}
                </span>

            </div>


            <div
                class="admin-status"
            >
                ${STATUS_NAMES[step]}
            </div>

        </div>



        <!-- BODY -->

        <div
            class="admin-order-body"
        >

            <div
                class="admin-order-grid"
            >


                <!-- CUSTOMER -->

                <div>

                    <h3
                        class="admin-section-title"
                    >
                        👤 Customer Information
                    </h3>


                    <div
                        class="customer-info"
                    >

                        <div
                            class="customer-row"
                        >

                            <strong>
                                Name:
                            </strong>

                            <span>
                                ${escapeHTML(
                                    customer.name ||
                                    "—"
                                )}
                            </span>

                        </div>


                        <div
                            class="customer-row"
                        >

                            <strong>

/* =====================================================
   UPDATE STATUS
===================================================== */

function updateOrderStatus(
    index
) {

    const select =
        document.getElementById(
            `status-${index}`
        );


    if (!select) {

        return;

    }


    const newStep =
        Number(
            select.value
        );


    if (
        !orders[index]
    ) {

        return;

    }


    orders[index].trackingStep =
        newStep;


    /*
       Save status update time.
    */

    orders[index].updatedAt =
        new Date()
            .toISOString();


    saveOrders();


    /*
       Update last order too,
       if it is the same order.
    */

    try {

        const lastOrder =
            JSON.parse(
                localStorage.getItem(
                    "shoppingMelaLastOrder"
                )
            );


        if (
            lastOrder &&
            String(
                lastOrder.orderId
            ) ===
            String(
                orders[index].orderId
            )
        ) {

            lastOrder.trackingStep =
                newStep;

            lastOrder.updatedAt =
                orders[index].updatedAt;


            localStorage.setItem(
                "shoppingMelaLastOrder",
                JSON.stringify(
                    lastOrder
                )
            );

        }

    } catch (error) {

        /*
           Ignore
        */

    }


    renderStats();

    renderOrders();


    showToast(
        "Order status successfully updated ✓"
    );

}



/* =====================================================
   DELETE
===================================================== */

function deleteOrder(
    index
) {

    if (
        !orders[index]
    ) {

        return;

    }


    const orderId =
        orders[index].orderId ||
        "this order";


    const confirmed =
        confirm(
            `Order #${orderId} delete করতে চান?`
        );


    if (!confirmed) {

        return;

    }


    orders.splice(
        index,
        1
    );


    saveOrders();

    renderStats();

    renderOrders();


    showToast(
        "Order deleted"
    );

}



/* =====================================================
   CLEAR ALL
===================================================== */

function clearAllOrders() {

    if (!orders.length) {

        showToast(
            "কোনো order নেই"
        );

        return;

    }


    const confirmed =
        confirm(
            "সব orders permanently delete করতে চান?"
        );


    if (!confirmed) {

        return;

    }


    orders = [];


    localStorage.removeItem(
        "shoppingMelaOrders"
    );


    localStorage.removeItem(
        "shoppingMelaLastOrder"
    );


    renderStats();

    renderOrders();


    showToast(
        "সব orders clear করা হয়েছে"
    );

}



/* =====================================================
   TOAST
===================================================== */

function showToast(
    message
) {

    const toast =
        document.getElementById(
            "adminToast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.adminToastTimer
    );


    window.adminToastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}



/* =====================================================
   INIT
===================================================== */

document.addEventListener(

        loadOrders();

        renderStats();

        renderOrders();

    }
);

</script>
